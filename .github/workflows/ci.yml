name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sms/portal build
      - run: pnpm --filter @sms/api exec tsc -p .
      - run: pnpm --filter @sms/api exec wrangler deploy --dry-run --outdir dist
      # RLS test needs DATABASE_URL secret; enable once a CI DB exists (do not point at prod).
